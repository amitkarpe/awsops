name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch and verify immutable upstream test fixture
        run: python scripts/fetch_native_fixture.py
      - name: Run tests
        env:
          AWSOPS_REQUIRE_NATIVE_FIXTURE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py'
