name: AWSOPS Read-only LAB

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: awsops-readonly
  cancel-in-progress: false

jobs:
  readonly:
    name: Bounded account-local Config posture
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: awsops-lab-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    env:
      # Source gate: change only through reviewed activation after #86 owner approval,
      # verified main-only Environment, IAM attachment/readback and one-run authority.
      # Not a dispatch input, repository variable, or secret.
      CONFIG_ACQUISITION_ENABLED: 'false'
      AWS_REGION: ap-southeast-1
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_MAX_ATTEMPTS: '1'
      AWS_RETRY_MODE: standard
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assume the existing proven role only after activation
        if: env.CONFIG_ACQUISITION_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: awsops-readonly
          role-duration-seconds: 900
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ secrets.AWS_EXPECTED_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true
          translate-env-variables: false
          disable-retry: true
      - name: Publish bounded sanitized posture or explicit disabled status
        shell: bash
        env:
          EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_EXPECTED_ACCOUNT_ID }}
        run: |
          set +x
          set -euo pipefail
          python scripts/config_posture.py
